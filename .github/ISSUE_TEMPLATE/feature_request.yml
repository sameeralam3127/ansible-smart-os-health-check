---
name: Feature request
description: A new check, output, or integration
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to find out about your fleet, and what stops you today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like it to do
      description: >-
        If it is a new check, say what a healthy host and an unhealthy host
        look like, and how the answer can be read without guessing.
    validations:
      required: true

  - type: input
    id: distros
    attributes:
      label: Distributions it applies to
      placeholder: "RHEL family only / all four"

  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
      description: Existing workaround, if any.
