---
version: 2
updates:
  # Actions are pinned to commit SHAs in the workflows; Dependabot is what
  # keeps those pins current, so this is not optional maintenance.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      dev-tooling:
        patterns:
          - "*"
