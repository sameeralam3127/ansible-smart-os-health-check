name: CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      ANSIBLE_LOCAL_TEMP: .ansible/tmp
      ANSIBLE_REMOTE_TEMP: .ansible/tmp
      ANSIBLE_HOME: .ansible

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          ansible-galaxy collection install -r requirements.yml
          ansible-galaxy collection install -r molecule/collections.yml

      - name: Symlink repository as the sameeralam3127.linux_vitals collection
        run: |
          mkdir -p .dev-collections/ansible_collections/sameeralam3127
          ln -s "$GITHUB_WORKSPACE" .dev-collections/ansible_collections/sameeralam3127/linux_vitals

      - name: Run playbook syntax check
        run: ansible-playbook playbooks/healthcheck.yml --syntax-check

      - name: Run ansible-lint
        run: ansible-lint roles/ playbooks/ molecule/

      - name: Run pytest template checks
        run: pytest -q

  molecule:
    name: molecule (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        # One scenario per supported distribution family; see docs/testing.md.
        scenario:
          - ubuntu
          - rocky
          - fedora
          - opensuse

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          ansible-galaxy collection install -r requirements.yml
          ansible-galaxy collection install -r molecule/collections.yml

      - name: Symlink repository as the sameeralam3127.linux_vitals collection
        # create.yml maintains this too, but the scenario's syntax check runs
        # before create, and it needs the FQCN roles to already resolve.
        run: |
          mkdir -p .dev-collections/ansible_collections/sameeralam3127
          ln -sfn "$GITHUB_WORKSPACE" .dev-collections/ansible_collections/sameeralam3127/linux_vitals

      - name: Run the ${{ matrix.scenario }} scenario
        run: molecule test -s ${{ matrix.scenario }}
